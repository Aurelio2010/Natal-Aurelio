<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz Ano Novo 🎆</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: radial-gradient(circle at bottom, #020024, #000);
  height: 100vh;
  overflow: hidden;
  color: white;
}

#container {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  z-index: 10;
  width: 90%;
  max-width: 400px;
}

h1 {
  font-size: 2.5em;
  animation: brilho 2s infinite alternate;
}

@keyframes brilho {
  from { text-shadow: 0 0 10px gold; }
  to { text-shadow: 0 0 30px white; }
}

input {
  width: 100%;
  margin-top: 12px;
  padding: 12px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  outline: none;
}

button {
  margin-top: 15px;
  padding: 12px 20px;
  border-radius: 10px;
  border: none;
  background: gold;
  font-size: 16px;
  cursor: pointer;
  width: 100%;
}

canvas {
  position: absolute;
  top: 0;
  left: 0;
}
</style>
</head>

<body>

<canvas id="fogos"></canvas>

<div id="container">
  <h1>🎉 Feliz Ano Novo! 🎉</h1>
  <p style="margin-top:10px;">Seu nome</p>
  <input id="nome" placeholder="Digite seu nome">

  <p style="margin-top:10px;">Sua mensagem</p>
  <input id="mensagem" placeholder="Mensagem de Ano Novo 🎆">

  <button onclick="enviar()">Enviar 🎇</button>
</div>

<!-- EMAILJS -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
  emailjs.init("R5-4FRCx6UA89RPg7");
</script>

<script>
// 🎆 FOGOS DE ARTIFÍCIO
const canvas = document.getElementById("fogos");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let fogos = [];

function criarFogo() {
  const x = Math.random() * canvas.width;
  const y = Math.random() * canvas.height / 2;
  const cores = ["red", "yellow", "cyan", "lime", "magenta", "orange"];

  for (let i = 0; i < 70; i++) {
    fogos.push({
      x,
      y,
      r: Math.random() * 3 + 1,
      dx: (Math.random() - 0.5) * 6,
      dy: (Math.random() - 0.5) * 6,
      cor: cores[Math.floor(Math.random() * cores.length)],
      vida: 100
    });
  }
}

function animar() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  fogos.forEach((f, i) => {
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
    ctx.fillStyle = f.cor;
    ctx.fill();

    f.x += f.dx;
    f.y += f.dy;
    f.vida--;

    if (f.vida <= 0) fogos.splice(i, 1);
  });

  requestAnimationFrame(animar);
}

setInterval(criarFogo, 700);
animar();

// 📩 ENVIAR EMAIL
function enviar() {
  const nome = document.getElementById("nome").value.trim();
  const mensagem = document.getElementById("mensagem").value.trim();

  if (!nome || !mensagem) {
    alert("Preencha todos os campos 😊");
    return;
  }

  emailjs.send("service_e259imu", "template_93uj9tm", {
    name: nome,
    mensagem: mensagem,
    email: "anonimo@email.com"
  })
  .then(() => {
    document.getElementById("container").innerHTML = `
      <h1>🎆 Obrigado, ${nome}! 🎆</h1>
      <p>Muito obrigado e tenha um propéro Ano Novo 💌</p>
    `;
  })
  .catch((erro) => {
    alert("Erro ao enviar 😢");
    console.error(erro);
  });
}
</script>

</body>
</html>
