<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Feliz Natal 🎄</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #e53935, #2e7d32);
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
  overflow: hidden;
}

.box {
  background: rgba(255,255,255,0.15);
  padding: 25px;
  border-radius: 20px;
  width: 90%;
  max-width: 400px;
  text-align: center;
  animation: surgir 1s ease;
}

@keyframes surgir {
  from { opacity: 0; transform: scale(0.8); }
  to { opacity: 1; transform: scale(1); }
}

input, button {
  width: 100%;
  padding: 12px;
  margin-top: 12px;
  border-radius: 8px;
  border: none;
  font-size: 1em;
}

button {
  background: #ffcc00;
  font-weight: bold;
  cursor: pointer;
}

.autor {
  position: fixed;
  bottom: 10px;
  right: 15px;
  font-size: 0.9em;
  opacity: 0.8;
}

/* ❄️ Neve */
.snow {
  position: fixed;
  top: -10px;
  font-size: 18px;
  animation: cair linear infinite;
}

@keyframes cair {
  from { transform: translateY(0); }
  to { transform: translateY(100vh); }
}
</style>
</head>

<body>

<div class="box" id="box">
  <h1 id="titulo">🎄 Feliz Natal 🎄</h1>
  <p id="texto">Qual é o seu nome?</p>
  <input id="input" placeholder="Digite o seu nome">
  <button onclick="avancar()">Continuar</button>
</div>

<div class="autor">Criado por <strong>Aurélio</strong></div>

<script>
let passo = 0;
let nome = "";

const perguntas = [
  "Você gostou de ter conhecido o Aurélio?",
  "Quer deixar uma mensagem de Natal?"
];

function avancar() {
  const valor = document.getElementById("input").value.trim();
  if (!valor) {
    alert("Por favor, escreva algo 😊");
    return;
  }

  if (passo === 0) {
    nome = valor;
    document.getElementById("titulo").innerText = `🎄 Feliz Natal, ${nome}! 🎄`;
    document.getElementById("texto").innerText = perguntas[0];
    document.getElementById("input").value = "";
    document.getElementById("input").placeholder = "Digite sua resposta";
    passo++;
  } 
  else if (passo === 1) {
    document.getElementById("texto").innerText = perguntas[1];
    document.getElementById("input").value = "";
    passo++;
  } 
  else {
    finalizar();
  }
}

function finalizar() {
  document.getElementById("box").innerHTML = `
    <h1>🎉 Obrigado, ${nome}! 🎉</h1>
    <p>Para terminar, responda rapidinho no formulário 😊</p>
    <button onclick="irFormulario()">Responder formulário</button>
  `;
  soltarConfete();
}

function irFormulario() {
  window.open(
    "https://docs.google.com/forms/d/e/1FAIpQLSdK2x-f4o_8Y7nlPi8vQOtIQ2K4MfRjID3VBI7pGnJA6-2wQw/viewform?usp=header",
    "_blank"
  );
}

/* ❄️ Neve */
for (let i = 0; i < 25; i++) {
  let s = document.createElement("div");
  s.className = "snow";
  s.innerText = "❄";
  s.style.left = Math.random() * 100 + "vw";
  s.style.animationDuration = (Math.random() * 5 + 5) + "s";
  document.body.appendChild(s);
}

/* 🎊 Confete */
function soltarConfete() {
  for (let i = 0; i < 20; i++) {
    let c = document.createElement("div");
    c.innerText = "🎊";
    c.style.position = "fixed";
    c.style.left = Math.random() * 100 + "vw";
    c.style.top = Math.random() * 100 + "vh";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3000);
  }
}
</script>

</body>
</html>
